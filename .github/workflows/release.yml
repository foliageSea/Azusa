name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (e.g. v0.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate tag and version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python tool/package_release.py metadata --tag "$RELEASE_TAG"
      - name: Resolve immutable build commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Check and test
        run: |
          mkdir -p /tmp/opencode
          python -m unittest discover -s tool -p 'test_*.py'
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

  android:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/azusa-release.jks
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD',
                      'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub Secrets: ' + ', '.join(missing))
          path = Path(os.environ['ANDROID_KEYSTORE_PATH'])
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as file:
              file.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PY
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null
      - name: Build signed arm64 APK
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --android-project-arg=force-version-code-ignoring-abi=true \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/Azusa-$VERSION-android-arm64-v8a.apk"
      - name: Verify APK signature, version and ABI
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APK="dist/Azusa-$VERSION-android-arm64-v8a.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          keytool -exportcert -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/azusa-signing.der" > /dev/null
          EXPECTED=$(sha256sum "$RUNNER_TEMP/azusa-signing.der" | cut -d ' ' -f1)
          grep -F "certificate SHA-256 digest: $EXPECTED" "$RUNNER_TEMP/apk-signature.txt"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionCode='$BUILD_NUMBER'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/azusa-release.jks" "$RUNNER_TEMP/azusa-signing.der"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Build Windows x64
        run: |
          flutter pub get --enforce-lockfile
          flutter build windows --release \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Bundle VC++ runtime and build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual C++ tools not found' }
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'VC++ redistributable DLLs not found' }
          Copy-Item "$($crt.FullName)\*.dll" build/windows/x64/runner/Release/
          $info = (Get-Item build/windows/x64/runner/Release/azusa.exe).VersionInfo
          if ($info.ProductVersion -ne "$env:VERSION+$env:BUILD_NUMBER") {
            throw "Unexpected application version: $($info.ProductVersion)"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 not found on runner' }
          & $iscc "/DAppVersion=$env:VERSION" "/DBuildNumber=$env:BUILD_NUMBER" tool/packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          $installer = Get-Item "dist/Azusa-$env:VERSION-windows-x64-setup.exe"
          if ($installer.VersionInfo.FileVersion -ne "$env:VERSION.$env:BUILD_NUMBER") {
            throw 'Installer version mismatch'
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Build macOS arm64 with ad-hoc signing
        run: |
          test "$(uname -m)" = arm64
          flutter config --enable-macos-desktop --enable-macos-arm64-only
          flutter pub get --enforce-lockfile
          flutter build macos --config-only --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/macos \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
      - name: Package DMG and verify
        run: python tool/package_release.py macos --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libsecret-1-dev libstdc++-12-dev dpkg-dev
      - name: Build Linux amd64
        run: |
          flutter pub get --enforce-lockfile
          flutter build linux --release --target-platform linux-x64 \
            --build-name "$VERSION" --build-number "$BUILD_NUMBER"
      - name: Package DEB and verify
        run: python tool/package_release.py linux --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: [validate, android, windows, macos, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      BUILD_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete asset set and generate checksums
        run: |
          python tool/package_release.py checksums --tag "$RELEASE_TAG"
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Confirm release and tag still match
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$BUILD_COMMIT"
      - name: Upload release assets
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
