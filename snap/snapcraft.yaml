name: azusa
version: 0.0.3
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-azusa: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.azusa # adjust accordingly to your app name

apps:
  azusa:
    command: azusa
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-azusa
parts:
  azusa:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
